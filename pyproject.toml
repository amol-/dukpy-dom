[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dukpy-dom"
version = "0.1.0"
description = "A virtual DOM and browserless UI-testing library for dukpy"
requires-python = ">=3.9"
dependencies = ["dukpy"]

[project.optional-dependencies]
dev = ["pytest", "pytest-bdd", "ruff"]

[tool.setuptools]
packages = ["dukpy_dom"]

[tool.setuptools.package-data]
dukpy_dom = ["runtime.js", "vendor/*.js"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "F401", "I001"]
